const $=s=>document.querySelector(s);const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));const today=()=>Math.floor(Date.now()/86400000);function save(){localStorage.setItem(KEY,JSON.stringify(db));updateBadge()}function cards(n){let u=BOOK[n-1];return [...u.cards.map((c,i)=>({...c,id:n+'-'+i,unit:n})),...db.extra.filter(c=>c.unit===n)]}function allCards(){return BOOK.flatMap(u=>cards(u.n))}function state(c){return db.cards[c.id]||{reps:0,due:0,interval:0,ease:2.5,level:0}}function due(c){let s=state(c);return s.reps>0&&s.due<=today()}function learned(c){return state(c).reps>0}function updateBadge(){let num=allCards().filter(due).length;$('#dueBadge').textContent=num?'('+num+')':''}function nav(p){page=p;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===p));render()}document.querySelectorAll('.nav').forEach(x=>x.onclick=()=>nav(x.dataset.page));
function summary(){let a=allCards(),seen=a.filter(learned).length,rev=a.filter(due).length,solid=a.filter(c=>state(c).interval>=14).length;return `<div class="stats"><div class="stat"><strong>${BOOK.length}</strong><span>rozdziałów</span></div><div class="stat"><strong>${a.length}</strong><span>wyodrębnionych haseł</span></div><div class="stat"><strong>${seen}</strong><span>przerobionych fiszek</span></div><div class="stat"><strong>${rev}</strong><span>do powtórzenia</span></div></div>`}
function home(){let val=$('#searchBox')?.value||'';let u=BOOK.filter(x=>x.title.toLowerCase().includes(val.toLowerCase())||String(x.n)===val);return `<div class="eyebrow">Twoja biblioteka</div><h1>Ucz się słówek, nie tylko je czytaj.</h1><p>Wybierz rozdział, przywołuj słowa z pamięci i powtarzaj je wtedy, gdy zaczynasz zapominać.</p>${summary()}<div class="toolbar"><button class="btn primary" id="goReview">Powtórz zaległe fiszki</button><input id="searchBox" class="search" value="${escapeHTML(val)}" placeholder="Szukaj rozdziału / numeru..."></div><div class="unitgrid" id="unitgrid">${unitList(u)}</div><div class="footer">Uwaga: tylko hasła z definicjami po angielsku trafiają do nauki. Pozostałe zostały automatycznie wyodrębnione z przesłanego PDF. W wybranych miejscach mogą wymagać korekty (np. podzielone wyrażenia). Możesz edytować lub dodawać hasła. To narzędzie do pracy z książką, nie kopia pełnych rozdziałów.</div>`}
function unitList(items){return items.map(u=>{let cc=cards(u.n),seen=cc.filter(learned).length;return `<button class="unit" data-unit="${u.n}"><span class="eyebrow">Unit ${u.n}</span><strong>${escapeHTML(u.title)}</strong><div class="progress"><i style="width:${cc.length?100*seen/cc.length:0}%"></i></div><span class="count">${seen}/${cc.length} haseł · ${cc.filter(due).length} powtórek</span></button>`}).join('')}
function unitPage(){let u=BOOK[unit-1],cc=cards(unit);return `<div class="eyebrow">Unit ${unit} / 101</div><h1>${escapeHTML(u.title)}</h1><p>${cc.length} haseł z materiału. Do nauki trafiają tylko hasła z definicją po angielsku. Pozostałe możesz poprawić ręcznie.</p><div class="toolbar"><button class="btn primary" id="startUnit">▶ Ucz się haseł z definicją</button><button class="btn" id="startDifficult">↻ Tylko problematyczne</button><button class="btn" id="addCard">+ Dodaj hasło</button><button class="btn ghost" id="homeBtn">← Rozdziały</button></div><div class="panel"><b>Lista haseł</b><div class="help">Brak definicji angielskiej oznacza, że wyrażenie nie jest jeszcze gotowe do fiszek. Kontekst nie zastępuje znaczenia. Kliknij „Edytuj”, aby je uzupełnić.</div>${cc.map(c=>`<div class="listrow"><div><b>${escapeHTML(c.t)}</b><small>${escapeHTML(getCard(c).en||'⚠ Brak definicji angielskiej — pominięte w nauce')}</small></div><button class="btn" data-edit="${escapeHTML(c.id)}">Edytuj</button></div>`).join('')||'<p>Automatycznie nie rozpoznano wyróżnionych haseł na tej stronie. Możesz dodać je ręcznie.</p>'}</div>`}
const VERIFIED_DEFS={"cram for an exam": "intensywnie uczyć się do egzaminu w krótkim czasie", "genius": "osoba wyjątkowo inteligentna", "do some revision": "powtarzać materiał", "revise": "powtarzać materiał przed egzaminem", "past papers": "arkusze egzaminacyjne z poprzednich lat", "learn by heart": "nauczyć się na pamięć", "rote-learning": "mechaniczne uczenie się przez powtarzanie", "mnemonics": "techniki ułatwiające zapamiętywanie", "bury yourself in your books": "poświęcić niemal cały czas nauce", "study intensively": "uczyć się w bardzo skupiony sposób", "know the subject inside out": "znać temat na wylot", "carry out research": "prowadzić badania", "academic journals": "czasopisma naukowe", "papers": "artykuły naukowe", "access it online": "uzyskać dostęp przez internet", "inter-library loan": "wypożyczenie międzybiblioteczne", "open educational resources": "otwarte zasoby edukacyjne", "demanding": "wymagający", "drop out": "przerwać studia lub kurs przed ukończeniem", "finals": "egzaminy końcowe na studiach", "well-qualified": "posiadający odpowiednie kwalifikacje", "composition": "krótkie wypracowanie", "essay": "esej, dłuższa praca pisemna", "assignment": "praca zaliczeniowa", "project": "projekt oparty na samodzielnej pracy", "portfolio": "zbiór indywidualnych prac", "dissertation": "obszerna praca dyplomowa oparta na badaniach", "thesis": "rozprawa naukowa oparta na oryginalnych badaniach", "mind map": "mapa myśli", "first draft": "pierwszy szkic pracy", "plagiarism": "plagiat, przywłaszczenie cudzej pracy", "deadline": "ostateczny termin oddania pracy", "feedback": "informacja zwrotna od prowadzącego", "acknowledge": "wskazać, podać wykorzystane źródła", "submitted": "złożony, formalnie oddany", "assessed": "oceniony", "cut and paste": "kopiować i wklejać", "plagiarism form": "oświadczenie dotyczące plagiatu", "all your own work": "w pełni samodzielna praca", "writing up": "spisywanie wersji końcowej"};const EN_DEFS={"composition": "A short piece of writing, often for school.", "essay": "A longer, more serious piece of writing on a subject.", "assignment": "A substantial piece of work given as part of a course.", "project": "A piece of course work focused on your own chosen material or topic.", "portfolio": "A collection of separate examples of your work.", "dissertation": "A long research-based work written for a degree or diploma.", "thesis": "A lengthy, original research work for a higher degree.", "mind map": "A diagram showing ideas and the connections between them.", "first draft": "The first, rough version of a piece of writing.", "plagiarism": "Using another person’s work as if it were your own.", "acknowledge": "To give details of sources you have used.", "deadline": "The date by which a piece of work must be handed in.", "submitted": "Formally handed in for assessment.", "assessed": "Evaluated and given a grade.", "feedback": "Comments about your work from a teacher or tutor.", "cram": "To study very intensively for a short period of time.", "genius": "A person who is exceptionally clever.", "do some revision": "To review material you have studied before.", "revise": "To review what you have already studied.", "past papers": "Exam papers from previous years.", "rote-learning": "Learning something purely through repetition.", "mnemonics": "Memory tricks that help you remember information.", "cram for an exam": "To study very intensively shortly before an examination.", "learn by heart": "To memorise something completely.", "bury yourself in your books": "To spend as much time as possible studying.", "study intensively": "To study in a very focused way.", "know the subject inside out": "To know a subject completely.", "carry out research": "To conduct systematic research.", "academic journals": "Publications containing scholarly articles on specialist subjects.", "papers": "Scholarly articles published on specialist subjects.", "access it online": "To obtain or view something through the internet.", "inte function getCard(c){let over=db.cards[c.id]||{};let t=over.t??c.t;return {...c,t,c:over.c??c.c,en:over.en??c.en??(c.unit===1?EN_DEFS[t.toLowerCase()]||'':''),pl:over.pl??(c.unit===1?VERIFIED_DEFS[t.toLowerCase()]||c.pl||'':c.pl||'')}}
function start(list){if(!list.length){alert('W tym zestawie nie ma jeszcze fiszek z definicją. Możesz dodać znaczenia w edycji haseł.');return;}queue=[...list].sort(()=>Math.random()-.5);cursor=0;revealed=false;page='study';render()}function beginUnit(difficult=false){let a=cards(unit).filter(c=>!!getCard(c).en.trim());start(difficult?a.filter(c=>due(c)||state(c).level<=1&&learned(c)):a)}function beginReview(){let dueCards=allCards().filter(c=>due(c)&&!!getCard(c).en.trim());start(dueCards.slice(0,Number(db.config.daily)||20))}
function maskContext(c){let str=getCard(c).c||'',t=getCard(c).t;if(!str)return 'Przypomnij sobie wyrażenie z książki.';let ix=str.toLowerCase().indexOf(t.toLowerCase());if(ix<0)return escapeHTML(str);return escapeHTML(str.slice(0,ix))+'<b style="color:#146055">__________</b>'+escapeHTML(str.slice(ix+t.length))}
function study(){if(cursor>=queue.length)return `<div class="empty"><h1>Sesja zakończona ✓</h1><p>Powtórki poznanych wyrażeń pojawią się później.</p><button class="btn primary" id="backStudy">Wróć do rozdziałów</button></div>`;let c=queue[cursor],x=getCard(c);return `<div class="topline"><div><div class="eyebrow">Sesja nauki · Unit ${c.unit}</div><h1 style="font-size:25px">Przypomnij sobie angielskie wyrażenie</h1></div><span class="pill">${cursor+1} / ${queue.length}</span></div><div class="progress"><i style="width:${100*cursor/queue.length}%"></i></div><div class="studycard"><div class="muted">Definition in English</div><h2>${escapeHTML(x.en)}</h2>${x.pl?`<div class="plhint">${escapeHTML(x.pl)}</div>`:''}<div class="help" style="margin:14px 0 9px">Jakie dokładne angielskie słowo lub wyrażenie pasuje do tej definicji?</div>${revealed?`<div class="answer"><div class="muted">Odpowiedź z książki</div><p style="font-size:24px;color:var(--ink);margin:8px 0;font-weight:750">${escapeHTML(x.t)}</p><div id="myAnswerPreview" class="help"></div>${x.c?`<div class="help" style="margin-top:15px">Przykład / kontekst:</div><div class="prompt" style="text-align:left">${escapeHTML(x.c)}</div>`:''}</div><div class="gradebuttons"><button class="btn" data-grade="0">Nie pamiętam</button><button class="btn" data-grade="1">Z trudem</button><button class="btn primary" data-grade="2">Pamiętam</button><button class="btn" data-grade="3">Łatwe</button></div>`:`<form id="answerForm" style="margin:12px auto;max-width:510px;display:flex;flex-wrap:wrap;gap:10px"><input id="answerInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Wpisz wyrażenie po angielsku…" style="flex:1;min-width:190px;padding:13px 14px;border-radius:10px;border:1px solid #b5c5c9"><button class="btn primary" type="submit">Sprawdź odpowiedź</button><button class="btn" id="dontKnow" type="button">Nie wiem</button></form>`}</div><div class="help" style="text-align:center">Najpierw czytasz definicję po angielsku (z mniejszym tłumaczeniem polskim), potem odtwarzasz wyrażenie. Po sprawdzeniu oceń uczciwie swoją odpowiedź.</div>`}
function grade(v){let c=queue[cursor],old=state(c),s={...old};if(v===0){s.reps+=1;s.interval=1;s.level=0;s.ease=Math.max(1.3,s.ease-.2)}else if(v===1){s.reps+=1;s.interval=old.interval>1?Math.max(1,Math.round(old.interval*.6)):1;s.level=1;s.ease=Math.max(1.3,s.ease-.12)}else if(v===2){s.reps++;s.interval=old.interval===0?2:old.interval<=2?4:Math.max(5,Math.round(old.interval*s.ease));s.level=2}else{s.reps++;s.interval=old.interval===0?4:old.interval<=4?8:Math.round(old.interval*s.ease*1.25);s.level=3;s.ease+=.1}s.due=today()+s.interval;db.cards[c.id]=s;save();cursor++;revealed=false;render()}
function review(){return `<div class="eyebrow">Spaced repetition</div><h1>Dzisiejsze powtórki</h1><p>System planuje ponowne pojawienie się słów na podstawie Twoich ocen. Najtrudniejsze wracają szybciej.</p>${summary()}<div class="panel"><div class="row space"><div><b>${allCards().filter(due).length} słówek czeka na powtórkę</b><div class="help">Limit na sesję: ${db.config.daily||20}</div></div><button id="reviewStart" class="btn primary">Rozpocznij</button></div></div>`}
function browse(){let a=allCards();let f=filter==='due'?a.filter(due):filter==='known'?a.filter(learned):filter==='hard'?a.filter(c=>learned(c)&&state(c).level<=1):a;return `<div class="eyebrow">Twoja kolekcja</div><h1>Wszystkie hasła</h1><div class="toolbar"><select id="filterSelect" style="max-width:270px"><option value="all" ${filter==='all'?'selected':''}>Wszystkie</option><option value="known" ${filter==='known'?'selected':''}>Już przerabiane</option><option value="due" ${filter==='due'?'selected':''}>Do powtórki</option><option value="hard" ${filter==='hard'?'selected':''}>Trudne</option></select><input id="termSearch" class="search" placeholder="Szukaj słowa..." /></div><div class="panel" id="termResults">${termRows(f.slice(0,250))}</div><div class="help" style="margin-top:12px">Wyświetlane maksymalnie 250 wyników. Zawęź wyszukiwanie, aby zobaczyć inne.</div>`}
function termRows(f){return f.map(c=>`<div class="listrow"><div><b>${escapeHTML(getCard(c).t)}</b><small>Unit ${c.unit} · ${escapeHTML(getCard(c).en||'Brak definicji EN')}</small></div><button class="btn" data-edit="${escapeHTML(c.id)}">Edytuj</button></div>`).join('')||'<p>Brak haseł.</p>'}
function settings(){return `<div class="eyebrow">Dane i ustawienia</div><h1>Ustawienia</h1><div class="panel"><label><b>Limit fiszek na sesję powtórkową</b><input id="dailyLimit" type="number" min="1" max="300" value="${db.config.daily||20}" style="max-width:150px;margin:8px 0"></label><p class="help">Nowe fiszki wybierasz sam, rozpoczynając dany unit.</p><div class="toolbar"><button id="export" class="btn primary">Eksport postępów (JSON)</button><label class="btn">Import postępów <input type="file" id="import" accept=".json" hidden></label></div><p class="help">Postępy są zapisane tylko na tym urządzeniu w tej przeglądarce. Eksportuj je regularnie; nie synchronizują się automatycznie między telefonem a komputerem.</p></div>`}
function edit(id){let c=allCards().find(x=>x.id===id);if(!c)return;let x=getCard(c);let term=prompt('Hasło angielskie:',x.t);if(term===null)return;let en=prompt('Definicja po angielsku (wymagana do nauki):',x.en||'');if(en===null)return;let pl=prompt('Polskie znaczenie (opcjonalne):',x.pl);if(pl===null)return;let ctx=prompt('Kontekst / zdanie (opcjonalne):',x.c);if(ctx===null)return;db.cards[id]={...state(c),t:term.trim(),en:en.trim(),pl:pl.trim(),c:ctx.trim()};save();render()}
function addCard(){let t=prompt('Nowe angielskie słowo lub wyrażenie:');if(!t?.trim())return;let en=prompt('Definition in English (required for study):')||'';let pl=prompt('Znaczenie po polsku (opcjonalnie):')||'';let c=prompt('Przykład / kontekst (opcjonalnie):')||'';db.extra.push({id:'x'+Date.now(),unit,t:t.trim(),en,pl,c});save();render()}
function render(){let app=$('#app');app.innerHTML=page==='home'?home():page==='unit'?unitPage():page==='study'?study():page==='review'?review():page==='browse'?browse():settings();updateBadge();if(page==='home'){$('#goReview').onclick=beginReview;$('#searchBox').oninput=e=>{$('#unitgrid').innerHTML=unitList(BOOK.filter(u=>u.title.toLowerCase().includes(e.target.value.toLowerCase())||String(u.n)===e.target.value));bindUnits()};bindUnits()}if(page==='unit'){$('#startUnit').onclick=()=>beginUnit();$('#startDifficult').onclick=()=>beginUnit(true);$('#addCard').onclick=addCard;$('#homeBtn').onclick=()=>nav('home');bindEdits()}if(page==='study'){let f=$('#answerForm');if(f){let show=()=>{let val=$('#answerInput').value.trim();revealed=true;render();let out=$('#myAnswerPreview');if(out&&val)out.textContent='Twoja odpowiedź: '+val;};f.onsubmit=e=>{e.preventDefault();show()};$('#dontKnow').onclick=show;$('#answerInput').focus()}document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>grade(+b.dataset.grade));let back=$('#backStudy');if(back)back.onclick=()=>nav('home')}if(page==='review')$('#reviewStart').onclick=beginReview;if(page==='browse'){$('#filterSelect').onchange=e=>{filter=e.target.value;render()};$('#termSearch').oninput=e=>{let q=e.target.value.toLowerCase(),a=allCards().filter(c=>(getCard(c).t+' '+(getCard(c).en||'')+' '+(getCard(c).pl||'')).toLowerCase().includes(q));$('#termResults').innerHTML=termRows(a.slice(0,250));bindEdits()};bindEdits()}if(page==='settings'){$('#dailyLimit').onchange=e=>{db.config.daily=+e.target.value||20;save()};$('#export').onclick=()=>{let a=document.createElement('a'),blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='vocabulary-lab-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};$('#import').onchange=e=>{let f=e.target.files[0];if(!f)return;f.text().then(t=>{try{let x=JSON.parse(t);if(!x.cards||!Array.isArray(x.extra))throw Error();if(confirm('Zastąpić obecne postępy danymi z pliku?')){db=x;save();render()}}catch{alert('Nieprawidłowy plik kopii zapasowej')}})}}}
function bindUnits(){document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{unit=+b.dataset.unit;page='unit';render()})}function bindEdits(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit))}render();</script></body></html>
